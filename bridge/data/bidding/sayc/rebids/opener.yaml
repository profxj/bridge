# --- Strong 2C opener's rebid after the 2D waiting response. ---------------

- id: rebid_2c_2nt_balanced
  call: "2NT"
  when: { auction: ["2C", "P", "2D", "P"], by: opener }
  hand: { hcp: [22, 24], balanced: true }
  priority: 100
  why: "Balanced 22-24: rebid 2NT (systems-on continuations apply, e.g. Stayman/transfers)."
  source: "ACBL SAYC booklet — 2C opener's 2NT rebid."
